name: Preview

on:
  push:
    branches:
      - 'preview/*'
      - '!preview/*-staging'

permissions:
  contents: write

concurrency:
  group: site-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and stage
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Build site
        working-directory: source
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile
          pnpm build
      - name: Check out publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: publisher
      - name: Publish ASF preview branch
        working-directory: publisher
        env:
          PREVIEW_ROOT: ${{ github.workspace }}/source/build
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          preview_branch="${SOURCE_BRANCH}-staging"
          cp ../source/.asf.yaml "$PREVIEW_ROOT/.asf.yaml"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "refs/heads/$preview_branch" >/dev/null; then
            git fetch --depth=1 origin "refs/heads/$preview_branch"
            git switch --create "$preview_branch" FETCH_HEAD
          else
            git switch --orphan "$preview_branch"
          fi

          git rm -r --ignore-unmatch .
          cp -R "$PREVIEW_ROOT/." .
          git add --all

          if ! git diff --cached --quiet; then
            git commit -m "Deploy preview from $SOURCE_BRANCH" -m "Source: $SOURCE_SHA"
            git push --set-upstream origin "HEAD:refs/heads/$preview_branch"
          fi

          profile="${SOURCE_BRANCH#preview/}"
          echo "Preview: https://asyncband-${profile}.staged.apache.org/" >> "$GITHUB_STEP_SUMMARY"
