name: Deploy

on:
  push:
    branches:
      - main
      - 'preview/*'

permissions:
  contents: write

concurrency:
  group: site-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Build site
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile
          pnpm build
      - name: Select staging branch
        id: staging
        if: startsWith(github.ref_name, 'preview/')
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: echo "branch=site/${SOURCE_BRANCH#preview/}-staging" >> "$GITHUB_OUTPUT"
      - name: Publish production site
        if: github.ref_name == 'main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: asf-site
      - name: Publish staging site
        if: startsWith(github.ref_name, 'preview/')
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: ${{ steps.staging.outputs.branch }}
