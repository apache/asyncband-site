name: Deploy

on:
  push:
    branches:
      - main
      - 'preview/*'
  pull_request:
    types:
      - closed
    branches:
      - main
  # Refresh avatars even when website source files have not changed.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: site-deploy-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ (github.event.pull_request.head.ref || github.ref_name) != 'main' }}

jobs:
  deploy:
    name: Site
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Select publish branch
        id: publish
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$SOURCE_BRANCH" = main ]; then
            publish_branch=asf-site
            site_url="https://asyncband.apache.org/"
          else
            name="${SOURCE_BRANCH#preview/}"
            if [[ ! "$name" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo "Preview branch must be preview/<name> using lowercase letters, digits, and hyphens." >&2
              exit 1
            fi
            publish_branch="site/${name}-staging"
            site_url="https://asyncband-${name}.staged.apache.org/"
          fi
          echo "branch=$publish_branch" >> "$GITHUB_OUTPUT"
          echo "url=$site_url" >> "$GITHUB_OUTPUT"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Build site
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile
          pnpm build
      - name: Publish site (${{ steps.publish.outputs.branch }})
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: ${{ steps.publish.outputs.branch }}
      - name: Link to published site
        env:
          SITE_URL: ${{ steps.publish.outputs.url }}
        run: echo "Website submitted to ASF publishing — [open site](${SITE_URL})." >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Delete staging branch
    # The preview is over once the pull request is closed, merged or not.
    if: >-
      github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'preview/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the site/<name>-staging branch if it exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          name="${HEAD_REF#preview/}"
          [[ "$name" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || exit 0
          staging_branch="site/${name}-staging"
          if gh api "repos/${REPOSITORY}/git/ref/heads/${staging_branch}" --silent; then
            gh api -X DELETE "repos/${REPOSITORY}/git/refs/heads/${staging_branch}"
            echo "Deleted ${staging_branch}."
          else
            echo "No ${staging_branch} branch; nothing to do."
          fi
