<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><style>
    .beat {
        animation: beat 3.2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
    }
    @keyframes beat {
        0%, 100% { transform: scale(1); opacity: 1; }
        50%      { transform: scale(1.12); opacity: 0.82; }
    }
    @media (prefers-reduced-motion: reduce) { .beat { animation: none; } }
</style><path d="M 170.6,439.1 A 202,202 0 0 1 170.6,72.9" fill="none" stroke="#f4eee3" stroke-width="64" stroke-linecap="round"/><path d="M 341.4,72.9 A 202,202 0 0 1 341.4,439.1" fill="none" stroke="#f4eee3" stroke-width="64" stroke-linecap="round"/><circle class="beat" cx="256" cy="256" r="58.7" fill="#F2542D"/></svg>
